<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DSA for Beginners{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script>
  // Apply theme BEFORE first paint to avoid a flash of white/dark.
  (function () {
    try {
      var saved = localStorage.getItem("dsa-theme-v1");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-logo">{ }</span>
      <span class="brand-text">DSA for Beginners</span>
    </a>
    <nav class="topnav">
      {% set path = request.path %}
      <a href="{{ url_for('learn_index') }}"
         {% if path.startswith('/learn') %}class="active"{% endif %}>Learn</a>
      <a href="{{ url_for('practice_index') }}"
         {% if path.startswith('/practice') %}class="active"{% endif %}>Practice</a>
      <a href="{{ url_for('bookmarks') }}"
         {% if path == '/bookmarks' %}class="active"{% endif %}>Bookmarks</a>
      <a href="{{ url_for('highlights') }}"
         {% if path == '/highlights' %}class="active"{% endif %}>Highlights</a>
      <a href="{{ url_for('code_playground') }}"
         {% if path == '/code' %}class="active"{% endif %}>Code</a>
    </nav>
    <form class="search-form" action="{{ url_for('search') }}" method="get">
      <input type="search" name="q" placeholder="Search problems, lessons..."
             value="{{ request.args.get('q', '') }}">
    </form>
    <button type="button" class="theme-toggle" data-theme-toggle
            aria-label="Toggle dark mode">
      <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
      <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
    </button>
  </div>
</header>

<main class="content">
  {% block content %}{% endblock %}
</main>

<button type="button" class="highlight-popup" data-highlight-popup
        aria-label="Save selection as a highlight">★ Save highlight</button>

<footer class="bottombar">
  <p>
    A patient tutor for DSA — built for absolute beginners. Solutions
    in Python. Curriculum based on the Striver A-Z DSA Sheet.
  </p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
